[project]
name = "clone-vocal-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.0",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
    "chatterbox-tts>=0.1",
    "moshi>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["gpu: exige un GPU NVIDIA, exclu de la CI"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# B008 interdit un appel de fonction dans une valeur par defaut. C'est
# precisement l'idiome de FastAPI pour declarer une dependance ou un champ de
# formulaire (Depends(...), File(...), Form(...)) : le framework lit ces objets
# et ne les evalue jamais comme de vraies valeurs par defaut. Faux positif
# connu, limite aux routes.
"app/routes/*" = ["B008"]
